# Framing copy for /pillars — the shared intro and closing paragraphs that wrap
# the three pillar records. Migrated verbatim from the design plan.
pillars_intro: >-
  EnWild is a youth-led movement powered by volunteerism. It is built on three
  pillars that provide both foundation and direction. These pillars ensure that
  advocacy is not only about protecting biodiversity but also about empowering
  youth, respecting cultural practices, and amplifying unheard voices.

pillars_outro: >-
  Together, these three pillars establish a strong foundation for participatory
  conservation that is responsive to human diversity and culture-sensitive. By
  uniting youth leadership, community collaboration, and advocacy for overlooked
  species and habitats, they ensure conservation is locally led, equitable, and
  inclusive. This integrated approach makes advocacy sustainable, socially just,
  and respectful of diverse identities and traditions.

programs_intro: >-
  This section highlights EnWild's core initiatives and collaborations, aligned
  with its commitment to participatory conservation. These programs transform
  advocacy into concrete movement by uniting campaigns, partnerships, and
  community-school engagement to ensure conservation is inclusive,
  culture-sensitive, and sustainable. Some may be simple or small, but they
  create big impacts, showing that even modest actions can drive meaningful
  change for underappreciated species, habitats, and communities.

members_intro: >-
  The Members Section introduces the individuals who form the heart of EnWild. It
  highlights the diverse backgrounds, skills, and commitments of youth and
  volunteers who share a common passion for conservation.

resources_intro: >-
  EnWild's Learning Resource Materials are organized into two sections that
  support both organizational development and conservation and advocacy.
  Together, they strengthen the movement's identity and guide its efforts,
  ensuring that initiatives remain consistent, inclusive, and impactful.

updates_intro: >-
  Stories, articles, and campaigns from across the alliance, organized by the
  three EnWild pillars.
